name: Build Moho Manager EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    # --- 关键修改点 1：打包命令 ---
    # 你的截图显示文件名是 MohoScriptsManager-win.py
    # 我们用 --name 指定生成的文件名叫 "Moho Scripts Manager V2"
    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --icon="icon.ico" --add-data "icon.ico;." --name "Moho Scripts Manager V2" MohoScriptsManager-win.py

    # --- 关键修改点 2：上传路径 ---
    # 这里的 path 必须和上面 --name 生成的名字完全一致！
    # 也就是 dist/Moho Scripts Manager V2.exe
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MohoScriptsManager-V2-EXE  # 下载时的压缩包名字(不能有空格，建议用短横线)
        path: "dist/Moho Scripts Manager V2.exe"  # <--- 这里必须改对，加上双引号
        retention-days: 5
